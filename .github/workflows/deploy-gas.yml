# Deploys the Apps Script backend (gas/) to every shop in shops.json when main changes.
# Each shop's existing web-app deployment is updated in place (deploymentId in shops.json),
# so the /exec URLs used by the Workers never change. Never creates a new deployment.
#
# Required repository secret:
#   CLASPRC_JSON — contents of ~/.clasprc.json from a machine logged in with clasp 3.x
#                  as the owner of the shop sheets (ethermorph.corp@gmail.com).
name: Deploy GAS

on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
      - 'shops.json'
      - 'scripts/gas.mjs'
      - 'tests/gas-*.cjs'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Test backend on mocks
        run: npm run test:gas

      - name: Install clasp 3.4.1
        run: npm install -g @google/clasp@3.4.1

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Repository secret CLASPRC_JSON is not set (see PLAN.md Phase 7)"
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          # Fail early with a clear message if the secret was pasted incorrectly (e.g. quotes stripped).
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'))" \
            || { echo "::error::CLASPRC_JSON is not valid JSON — re-set it from the exact contents of ~/.clasprc.json"; exit 1; }

      - name: Push code to every shop
        run: npm run gas -- all push

      - name: Update each shop's existing deployment
        run: npm run gas -- all deploy "ci ${GITHUB_SHA::7}"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
