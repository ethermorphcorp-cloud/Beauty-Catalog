<script>
(function () {
  'use strict';

  // ---------- state ----------
  const BOOT = window.BOOT || {};
  const DESKTOP = window.matchMedia('(min-width: 1024px)');
  const CODE_PATTERN = /^[A-Za-z0-9_-]{1,40}$/;
  const NO_CATEGORY = '__none__';
  const NEW_CATEGORY = '__new__';
  const CSV_CHUNK = 50;
  const PAGE_SIZE = 20;

  const state = {
    token: null,
    user: null,
    settings: Object.assign({ shopName: '', logoFileId: '', lineOaId: '', primaryColor: '#2563EB', workerUrl: '' }, BOOT.settings || {}),
    products: [],
    categories: [],
    users: null,
    view: 'list',
    settingsTab: 'shop',
    q: '',
    categoryFilter: '',
    page: 1,
    pendingStatus: {},
    addFiles: [],
    csv: null,
  };
  let panel = null; // { id, images }

  // ---------- helpers ----------
  const $ = (sel, root) => (root || document).querySelector(sel);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const thumbUrl = (id, size) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (size || 320);
  const findProduct = (id) => state.products.find((p) => p.productId === id) || null;
  const isAdmin = () => state.user && state.user.role === 'admin';

  function storage(fn) {
    try {
      return fn(window.sessionStorage);
    } catch (err) {
      return null; // sessionStorage can be blocked inside the Apps Script iframe; the token stays in memory.
    }
  }

  const ICONS = {
    search: '<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path>',
    plus: '<path d="M12 5v14M5 12h14"></path>',
    addBox: '<rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M12 8v8M8 12h8"></path>',
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>',
    gear: '<path d="M10.16 4.63L10.44 2.12L13.56 2.12L13.84 4.63L15.91 5.49L17.88 3.91L20.09 6.12L18.51 8.09L19.37 10.16L21.88 10.44L21.88 13.56L19.37 13.84L18.51 15.91L20.09 17.88L17.88 20.09L15.91 18.51L13.84 19.37L13.56 21.88L10.44 21.88L10.16 19.37L8.09 18.51L6.12 20.09L3.91 17.88L5.49 15.91L4.63 13.84L2.12 13.56L2.12 10.44L4.63 10.16L5.49 8.09L3.91 6.12L6.12 3.91L8.09 5.49Z"></path><circle cx="12" cy="12" r="3.2"></circle>',
    external: '<path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path>',
    upload: '<path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path>',
    x: '<path d="M6 6l12 12M18 6L6 18"></path>',
    back: '<path d="M15 5l-7 7 7 7"></path>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path>',
    logout: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5M5 12h11"></path>',
    download: '<path d="M12 4v11M7 10l5 5 5-5"></path><path d="M5 20h14"></path>',
    check: '<path d="M5 12l5 5 9-10"></path>',
    star: '<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 16.9l-5.2 2.9 1-5.9-4.3-4.2 5.9-.8z"></path>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path>',
    alert: '<path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path>',
    folder: '<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M12 17v-6M9 14l3-3 3 3"></path>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6"></path><path d="M6 7l1 13h10l1-13M9 7V4h6v3"></path>',
    user: '<circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>',
    key: '<circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3"></path>',
  };
  function icon(name, size) {
    const s = size || 20;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  }

  /** Calls a server function. Resolves with data, rejects with an Error carrying the server's Thai message. */
  function api(name, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.ok) return resolve(res.data);
          const err = new Error((res && res.error) || 'เกิดข้อผิดพลาด กรุณาลองใหม่');
          err.code = res && res.code;
          if (err.code === 'auth' && state.token) endSession(err.message);
          reject(err);
        })
        .withFailureHandler(() => {
          const err = new Error('เชื่อมต่อระบบไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
          err.code = 'network';
          reject(err);
        })[name](...args);
    });
  }
  const call = (name, ...args) => api(name, state.token, ...args);

  function applyTheme(color) {
    const hex = /^#[0-9a-f]{6}$/i.test(color || '') ? color : '#2563EB';
    const rgb = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    const light = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.6;
    const accent = light ? '#' + rgb.map((c) => Math.round(c * 0.45).toString(16).padStart(2, '0')).join('') : hex;
    const root = document.documentElement.style;
    root.setProperty('--primary', hex);
    root.setProperty('--on-primary', light ? '#1C1917' : '#FFFFFF');
    root.setProperty('--accent-text', accent);
    root.setProperty('--primary-tint', hex + '1F');
  }

  function logoHtml(extraClass) {
    const s = state.settings;
    const cls = 'logo' + (extraClass ? ' ' + extraClass : '');
    if (s.logoFileId) return '<img class="' + cls + '" src="' + thumbUrl(s.logoFileId, 200) + '" alt="โลโก้ร้าน">';
    const initials = (s.shopName || 'ร้าน').replace(/\s+/g, '').slice(0, 2).toUpperCase();
    return '<span class="' + cls + ' initials" aria-hidden="true">' + esc(initials) + '</span>';
  }

  function toast(message, type) {
    const kind = type || 'success';
    const el = document.createElement('div');
    el.className = 'toast toast-' + kind;
    el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    el.innerHTML = icon(kind === 'success' ? 'check' : 'alert', 18) + '<span>' + esc(message) + '</span>';
    $('#toasts').appendChild(el);
    setTimeout(() => {
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 260);
    }, kind === 'success' ? 3000 : 6000);
  }

  /** Success toast plus any sharing warnings and a warning when the shop page could not be updated. */
  function report(data, message) {
    if (message) toast(message);
    ((data && data.warnings) || []).forEach((w) => toast(w, 'warn'));
    const sync = data && data.sync;
    if (sync && !sync.synced && !sync.skipped) toast('บันทึกแล้ว แต่อัปเดตหน้าร้านไม่สำเร็จ กรุณาบันทึกซ้ำภายหลัง', 'warn');
  }

  /** Runs an async action with a loading state on the button and a toast for errors. */
  async function busy(btn, fn) {
    if (btn) {
      if (btn.disabled) return undefined;
      btn.disabled = true;
      btn.classList.add('is-loading');
      btn.setAttribute('aria-busy', 'true');
    }
    try {
      return await fn();
    } catch (err) {
      if (err.code !== 'auth') toast(err.message, 'error');
      return undefined;
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('is-loading');
        btn.removeAttribute('aria-busy');
      }
    }
  }

  function invalid(id, message) {
    const el = document.getElementById(id);
    if (el) {
      el.setAttribute('aria-invalid', 'true');
      el.focus();
      el.addEventListener('input', () => el.removeAttribute('aria-invalid'), { once: true });
    }
    toast(message, 'error');
  }

  // ---------- modal ----------
  /** fields: [{ id, label, type: text|password|select, value, options: [[value, label]], hint }] → resolves values or null. */
  function modal(opts) {
    return new Promise((resolve) => {
      const root = $('#modal-root');
      const fields = opts.fields || [];
      root.innerHTML =
        '<div class="scrim" data-modal-cancel></div>' +
        '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
        '<h2 id="modal-title">' + esc(opts.title) + '</h2>' +
        (opts.body ? '<p>' + esc(opts.body) + '</p>' : '') +
        fields.map((f) =>
          '<div class="field"><label for="mf-' + f.id + '">' + esc(f.label) + '</label>' +
          (f.type === 'select'
            ? '<select id="mf-' + f.id + '" class="select">' + f.options.map((o) => '<option value="' + esc(o[0]) + '"' + (o[0] === f.value ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>'
            : '<input id="mf-' + f.id + '" class="input" type="' + (f.type || 'text') + '" value="' + esc(f.value || '') + '" autocomplete="' + (f.type === 'password' ? 'new-password' : 'off') + '" autocapitalize="none" spellcheck="false">') +
          (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') + '</div>'
        ).join('') +
        '<div class="modal-actions"><button type="button" class="btn btn-outline" data-modal-cancel>ยกเลิก</button>' +
        '<button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-modal-ok>' + esc(opts.confirmText || 'ตกลง') + '</button></div></div>';
      const previous = document.activeElement;
      const close = (value) => {
        root.innerHTML = '';
        document.removeEventListener('keydown', onKey, true);
        if (previous && previous.focus) previous.focus();
        resolve(value);
      };
      const ok = () => {
        if (!fields.length) return close(true);
        const values = {};
        fields.forEach((f) => { values[f.id] = document.getElementById('mf-' + f.id).value; });
        close(values);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); close(null); }
        if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); ok(); }
      };
      root.querySelectorAll('[data-modal-cancel]').forEach((b) => b.addEventListener('click', () => close(null)));
      root.querySelector('[data-modal-ok]').addEventListener('click', ok);
      document.addEventListener('keydown', onKey, true);
      (fields.length ? document.getElementById('mf-' + fields[0].id) : root.querySelector('[data-modal-ok]')).focus();
    });
  }
  const confirmDialog = (title, body, confirmText, danger) => modal({ title, body, confirmText, danger });

  // ---------- session ----------
  function renderLogin(message) {
    $('#shell').hidden = true;
    closePanel();
    const el = $('#login-screen');
    el.hidden = false;
    el.innerHTML =
      '<form class="login-card" id="login-form" novalidate>' +
      '<div class="login-brand">' + logoHtml() + '<h1>' + esc(state.settings.shopName || 'ระบบจัดการสินค้า') + '</h1><p>เข้าสู่ระบบจัดการสินค้า</p></div>' +
      (BOOT.setupNeeded ? '<p class="form-error">' + icon('alert', 16) + '<span>ระบบยังไม่ได้ตั้งค่าเริ่มต้น กรุณารันเมนู Catalog → ตั้งค่าเริ่มต้น ใน Google Sheet</span></p>' : '') +
      '<div class="field"><label for="login-user">ชื่อผู้ใช้</label><input id="login-user" class="input" autocomplete="username" autocapitalize="none" spellcheck="false"></div>' +
      '<div class="field"><label for="login-pw">รหัสผ่าน</label><input id="login-pw" class="input" type="password" autocomplete="current-password"></div>' +
      '<div id="login-error" class="form-error" role="alert"' + (message ? '' : ' hidden') + '>' + icon('alert', 16) + '<span>' + esc(message || '') + '</span></div>' +
      '<button class="btn btn-primary btn-block" type="submit"><span>เข้าสู่ระบบ</span></button>' +
      '<p class="hint center">ใส่รหัสผิด 5 ครั้งใน 15 นาที ระบบจะล็อกชั่วคราว</p></form>';
    $('#login-form').addEventListener('submit', onLogin);
    $('#login-user').focus();
  }

  function loginError(message) {
    const box = $('#login-error');
    box.hidden = false;
    box.querySelector('span').textContent = message;
  }

  async function onLogin(e) {
    e.preventDefault();
    const btn = e.target.querySelector('[type=submit]');
    const username = $('#login-user').value.trim();
    const password = $('#login-pw').value;
    if (!username || !password) return loginError('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
    btn.disabled = true;
    btn.classList.add('is-loading');
    try {
      const data = await api('login', username, password);
      await startSession(data.token, data.user);
    } catch (err) {
      loginError(err.message);
      $('#login-pw').value = '';
      $('#login-pw').focus();
    } finally {
      btn.disabled = false;
      btn.classList.remove('is-loading');
    }
  }

  async function startSession(token, user) {
    state.token = token;
    state.user = user;
    state.users = null;
    storage((s) => s.setItem('catalog.token', token));
    $('#login-screen').hidden = true;
    $('#shell').hidden = false;
    renderChrome();
    $('#view').innerHTML = '<div class="loading-block" aria-label="กำลังโหลด"></div>';
    try {
      await loadAll();
    } catch (err) {
      if (err.code !== 'auth') toast(err.message, 'error');
    }
    if (state.token) render();
  }

  async function loadAll() {
    const results = await Promise.all([call('getSettings'), call('listProducts'), call('getCategories')]);
    state.settings = results[0];
    state.products = results[1];
    state.categories = results[2];
    applyTheme(state.settings.primaryColor);
    renderChrome();
  }

  async function refreshCategories() {
    try {
      state.categories = await call('getCategories');
    } catch (err) {
      // Non-critical: the list keeps working with the previous categories.
    }
  }

  function endSession(message) {
    storage((s) => s.removeItem('catalog.token'));
    state.token = null;
    state.user = null;
    state.users = null;
    state.csv = null;
    renderLogin(message);
  }

  function logout() {
    if (state.token) api('logout', state.token).catch(() => {});
    endSession();
  }

  // ---------- chrome & routing ----------
  // "เพิ่มสินค้า" is not a menu item: it is a button on the product list that opens the add form (side panel / full page).
  const DESK_TABS = [['list', 'รายการสินค้า'], ['summary', 'สรุป'], ['csv', 'นำเข้า CSV'], ['settings', 'ตั้งค่า']];
  const MOBILE_TABS = [['list', 'grid', 'รายการสินค้า'], ['summary', 'chart', 'สรุป'], ['csv', 'upload', 'นำเข้า'], ['settings', 'gear', 'ตั้งค่า']];

  function renderChrome() {
    $('#brand-logo').innerHTML = logoHtml();
    $('#brand-name').textContent = state.settings.shopName || 'ร้านของฉัน';
    $('#user-chip').textContent = state.user ? state.user.displayName + ' · ' + (state.user.role === 'admin' ? 'Admin' : 'Staff') : '';
    $('#logout-btn').innerHTML = icon('logout', 22);
    $('#desk-tabs').innerHTML = DESK_TABS.map((t) => '<button type="button" data-nav="' + t[0] + '">' + t[1] + '</button>').join('');
    $('#bottom-nav').innerHTML = MOBILE_TABS.map((t) => '<button type="button" data-nav="' + t[0] + '">' + icon(t[1], 26) + t[2] + '</button>').join('');
    updateNav();
  }

  function updateNav() {
    document.querySelectorAll('[data-nav]').forEach((b) => {
      if (b.getAttribute('data-nav') === state.view) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
  }

  function setView(view) {
    if (state.view === 'settings' && view !== 'settings') applyTheme(state.settings.primaryColor); // drop unsaved colour preview
    state.view = view;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    if (!state.user) return;
    updateNav();
    const v = $('#view');
    if (state.view === 'summary') v.innerHTML = summaryHtml();
    else if (state.view === 'csv') v.innerHTML = csvHtml();
    else if (state.view === 'settings') {
      v.innerHTML = settingsHtml();
      if (state.settingsTab === 'users' && isAdmin() && !state.users) loadUsers();
    } else {
      v.innerHTML = listHtml();
      renderListItems();
    }
  }

  /** Re-renders whatever currently shows product data, without touching forms being edited. */
  function refreshProductViews() {
    if (state.view === 'list') renderListItems();
    if (state.view === 'summary') render();
    if (panel) renderPanelStatus();
  }

  // ---------- product list ----------
  function listHtml() {
    return '<div class="page">' +
      '<div class="page-head"><h1 class="page-title">รายการสินค้า</h1>' +
      '<button type="button" class="btn btn-primary" data-action="add-product">' + icon('plus', 18) + 'เพิ่มสินค้า</button></div>' +
      '<div class="list-toolbar"><div class="search"><label class="sr-only" for="q">ค้นหาสินค้า</label>' + icon('search', 20) +
      '<input id="q" class="input" type="search" placeholder="ค้นหารหัสหรือชื่อสินค้า" value="' + esc(state.q) + '" autocomplete="off"></div>' +
      '<div class="cat-filter"><label class="sr-only" for="cat-filter">กรองตามหมวดหมู่</label>' +
      '<select id="cat-filter" class="select">' + categoryFilterOptions() + '</select></div>' +
      '<div id="list-meta" class="list-meta"></div></div>' +
      '<div id="product-list" class="product-list"></div>' +
      '<nav id="list-pager" class="pager" aria-label="เปลี่ยนหน้ารายการสินค้า" hidden></nav></div>';
  }

  /** Options for the category filter: every category with its product count, plus "no category" when used. */
  function categoryFilterOptions() {
    const counts = new Map();
    state.categories.forEach((c) => counts.set(c.name, 0));
    let none = 0;
    state.products.forEach((p) => {
      if (!p.category) none++;
      else counts.set(p.category, (counts.get(p.category) || 0) + 1);
    });
    if (state.categoryFilter && state.categoryFilter !== NO_CATEGORY && !counts.has(state.categoryFilter)) state.categoryFilter = ''; // renamed or removed
    if (state.categoryFilter === NO_CATEGORY && !none) state.categoryFilter = '';
    let html = '<option value="">ทุกหมวดหมู่ (' + state.products.length + ')</option>';
    counts.forEach((n, name) => {
      html += '<option value="' + esc(name) + '"' + (state.categoryFilter === name ? ' selected' : '') + '>' + esc(name) + ' (' + n + ')</option>';
    });
    if (none) html += '<option value="' + NO_CATEGORY + '"' + (state.categoryFilter === NO_CATEGORY ? ' selected' : '') + '>ไม่มีหมวด (' + none + ')</option>';
    return html;
  }

  function filteredProducts() {
    const q = state.q.trim().toLowerCase();
    return state.products.filter((p) => {
      if (state.categoryFilter === NO_CATEGORY && p.category) return false;
      if (state.categoryFilter && state.categoryFilter !== NO_CATEGORY && p.category !== state.categoryFilter) return false;
      return !q || p.code.toLowerCase().indexOf(q) >= 0 || p.name.toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderListItems() {
    const meta = $('#list-meta');
    const list = $('#product-list');
    if (!meta || !list) return;
    const select = $('#cat-filter');
    if (select) {
      select.innerHTML = categoryFilterOptions(); // keeps focus; counts follow edits
      select.value = state.categoryFilter;
    }
    const items = filteredProducts();
    const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    if (state.page < 1) state.page = 1;
    const filtered = state.q.trim() || state.categoryFilter;
    meta.innerHTML = '<span>' + (filtered ? 'พบ ' : 'ทั้งหมด ') + items.length + ' รายการ</span>';
    if (!state.products.length) {
      list.innerHTML = '<div class="empty">' + icon('image', 32) + '<p>ยังไม่มีสินค้า</p><button type="button" class="btn btn-primary" data-action="add-product">' + icon('plus', 18) + 'เพิ่มสินค้าแรก</button></div>';
      renderPager(0, 1, 1);
      return;
    }
    const start = (state.page - 1) * PAGE_SIZE;
    list.innerHTML = items.length ? items.slice(start, start + PAGE_SIZE).map(productCard).join('') : '<div class="empty"><p>ไม่พบสินค้าที่ตรงกับการค้นหา</p></div>';
    renderPager(items.length, state.page, pages);
  }

  /** Previous / numbered pages / next. On phones only the current number shows between the arrows. */
  function renderPager(total, page, pages) {
    const nav = $('#list-pager');
    if (!nav) return;
    if (pages <= 1) {
      nav.hidden = true;
      nav.innerHTML = '';
      return;
    }
    const from = (page - 1) * PAGE_SIZE + 1;
    const to = Math.min(page * PAGE_SIZE, total);
    const nums = [];
    for (let n = 1; n <= pages; n++) if (n === 1 || n === pages || Math.abs(n - page) <= 1) nums.push(n);
    let buttons = '';
    nums.forEach((n, i) => {
      if (i > 0 && n - nums[i - 1] > 1) buttons += '<span class="pg-gap" aria-hidden="true">…</span>';
      buttons += '<button type="button" class="pg-btn pg-num"' + (n === page ? ' aria-current="page"' : '') + ' data-action="page" data-page="' + n + '" aria-label="หน้า ' + n + '">' + n + '</button>';
    });
    nav.hidden = false;
    nav.innerHTML =
      '<div class="pager-nav">' +
      '<button type="button" class="pg-btn" data-action="page" data-page="' + (page - 1) + '" aria-label="หน้าก่อนหน้า"' + (page <= 1 ? ' disabled' : '') + '>' + icon('back', 18) + '</button>' +
      buttons +
      '<button type="button" class="pg-btn pg-next" data-action="page" data-page="' + (page + 1) + '" aria-label="หน้าถัดไป"' + (page >= pages ? ' disabled' : '') + '>' + icon('back', 18) + '</button>' +
      '</div><span class="pager-info">แสดง ' + from + '–' + to + ' จาก ' + total + ' รายการ · หน้า ' + page + '/' + pages + '</span>';
  }

  async function toggleStatus(id) {
    const p = findProduct(id);
    if (!p || state.pendingStatus[id]) return;
    const previous = p.status;
    const next = previous === 'active' ? 'hidden' : 'active';
    p.status = next; // optimistic
    state.pendingStatus[id] = true;
    refreshProductViews();
    try {
      const data = await call('setStatus', id, next);
      Object.assign(p, data.product);
      report(data, next === 'hidden' ? 'ซ่อน ' + p.code + ' จากหน้าร้านแล้ว' : 'แสดง ' + p.code + ' บนหน้าร้านแล้ว');
    } catch (err) {
      p.status = previous;
      if (err.code !== 'auth') toast(err.message, 'error');
    } finally {
      delete state.pendingStatus[id];
      refreshProductViews();
    }
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (err) {
      // Clipboard API is often blocked inside the Apps Script iframe; fall back below.
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (err) {
      ok = false;
    }
    ta.remove();
    return ok;
  }

    const ok = await copyText(p.name + '\n' + base + '/p/' + encodeURIComponent(p.code));
    toast(ok ? 'คัดลอกลิงก์แล้ว' : 'คัดลอกไม่สำเร็จ กรุณาลองใหม่', ok ? 'success' : 'error');
  }

  // ---------- summary ----------
  function categoryStats() {
    const map = new Map();
    state.categories.forEach((c) => map.set(c.name, { name: c.name, on: 0, off: 0 }));
    state.products.forEach((p) => {
      const key = p.category || NO_CATEGORY;
      if (!map.has(key)) map.set(key, { name: key, on: 0, off: 0 });
      const s = map.get(key);
      if (p.status === 'active') s.on++;
      else s.off++;
    });
    return Array.from(map.values()).filter((s) => s.name !== NO_CATEGORY || s.on + s.off > 0);
  }

    const total = state.products.length;

    const stat = (label, n, cls) => '<div class="stat ' + cls + '"><span>' + label + '</span><strong>' + n + '</strong></div>';
    const tiles = categoryStats().map((s) => {
      const count = s.on + s.off;

        '<span class="bar"><span style="width:' + pct + '%"></span></span><span class="split">แสดง ' + s.on + ' · ซ่อน ' + s.off + '</span></button>';

    return '<div class="page"><h1 class="page-title">สรุปรายการสินค้า</h1>' +

  function validateProduct(input, selfId, prefix) {
    let problem = null;
    const clash = state.products.find((p) => p.productId !== selfId && p.code.toLowerCase() === input.code.toLowerCase());
    const sel = document.getElementById(prefix + '-cat');
    if (!CODE_PATTERN.test(input.code)) problem = ['-code', 'รหัสสินค้าใช้ได้เฉพาะ A-Z a-z 0-9 - _ ยาวไม่เกิน 40 ตัว'];
    else if (clash) problem = ['-code', 'รหัสสินค้า ' + input.code + ' มีอยู่แล้ว'];
    else if (!input.name) problem = ['-name', 'กรุณากรอกชื่อสินค้า'];
    else if (sel && sel.value === NEW_CATEGORY && !input.category) problem = ['-cat-new', 'กรุณากรอกชื่อหมวดใหม่'];
    if (problem) invalid(prefix + problem[0], problem[1]);
    return !problem;
  }

  // ---------- images ----------
  /** Resizes on a canvas (long side <= maxSide) and returns { name, mimeType, base64 }. */
  function resizeImage(file, maxSide, mimeType, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        if (mimeType === 'image/jpeg') {
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, w, h);
        }
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        const base = file.name.replace(/\.[^.]+$/, '') || 'image';
        resolve({
          name: base + (mimeType === 'image/png' ? '.png' : '.jpg'),
          mimeType,
          base64: canvas.toDataURL(mimeType, quality).split(',')[1],
        });
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('อ่านไฟล์รูปไม่ได้ (รองรับ JPG, PNG, WEBP)'));
      };
      img.src = url;
    });
  }

  function progressHtml(label, pct) {

  /** Uploads files one at a time (resized to 1600px JPEG 0.85). Returns the last server response. */
  async function uploadFiles(productId, files, progressId) {
    const progressEl = () => document.getElementById(progressId);
    let last = null;
    let failed = 0;
    for (let i = 0; i < files.length; i++) {
      if (progressEl()) progressEl().innerHTML = progressHtml('กำลังอัปโหลด ' + (i + 1) + ' จาก ' + files.length + ' ไฟล์ (ย่อรูปอัตโนมัติ)', Math.round((i / files.length) * 100));
      try {
        const img = await resizeImage(files[i], 1600, 'image/jpeg', 0.85);
        last = await call('uploadImage', productId, img);
        if (panel && panel.id === productId) {
          panel.images = last.images;
          renderPanelImages();
        }
      } catch (err) {
        if (err.code === 'auth') throw err;
        failed++;
        toast(files[i].name + ': ' + err.message, 'error');
      }
    }
    if (progressEl()) progressEl().innerHTML = '';
    const p = findProduct(productId);
    if (p && last) {
      p.coverFileId = last.coverFileId;
      p.coverPinned = last.coverPinned;
    }
    if (last) report(last, '');
    const okCount = files.length - failed;
    if (okCount) toast(failed ? 'อัปโหลดสำเร็จ ' + okCount + ' จาก ' + files.length + ' รูป' : 'อัปโหลด ' + okCount + ' รูปแล้ว', failed ? 'warn' : 'success');
    return last;
  }

  async function submitAdd() {
    const input = {
      code: $('#add-code').value.trim(),
      name: $('#add-name').value.trim(),
      category: categoryValue('add-cat'),
      description: $('#add-desc').value,
    };
    if (!validateProduct(input, null, 'add')) return;
    const adding = () => panel && panel.mode === 'add'; // the user may close the panel while files upload
    await busy(document.querySelector('.panel-footer [type=submit]'), async () => {
      const data = await call('createProduct', input);
      state.products.unshift(data.product);
      report(data, 'เพิ่มสินค้า ' + data.product.code + ' แล้ว');
      const files = state.addFiles;
      state.addFiles = [];
      if (files.length) await uploadFiles(data.product.productId, files, 'add-progress');
      await refreshCategories();
      state.q = '';
      state.categoryFilter = '';
      state.page = 1; // the new product is first
      if (adding()) closePanel();
      setView('list');
    });
  }

      Object.assign(findProduct(id), data.product);

      renderPanelImages();

  // ---------- CSV import (desktop only) ----------
  const CSV_TEMPLATE = '﻿code,name,category,description,folder_url\r\n' +
    'SKU-001,ชื่อสินค้าตัวอย่าง,หมวดตัวอย่าง,"รายละเอียดบรรทัดแรก\r\nบรรทัดที่สอง",\r\n' +
    'SKU-002,"ชื่อที่มีเครื่องหมาย , ต้องอยู่ในเครื่องหมายคำพูด",หมวดตัวอย่าง,รายละเอียด,\r\n';

  /** RFC 4180-style parser: quoted fields may contain commas, quotes ("") and line breaks. */
  function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = '';
    let quoted = false;
    const src = text.replace(/^﻿/, '');
    for (let i = 0; i < src.length; i++) {
      const ch = src[i];
      if (quoted) {
        if (ch === '"') {
          if (src[i + 1] === '"') { field += '"'; i++; } else quoted = false;
        } else field += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch !== '\r') field += ch;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim() !== ''));
  }

  function csvRowsToObjects(table) {
    const headers = table[0].map((h) => h.trim().toLowerCase());
    if (headers.indexOf('code') < 0 || headers.indexOf('name') < 0) throw new Error('ไฟล์ต้องมีคอลัมน์ code และ name (ดาวน์โหลดไฟล์ตัวอย่างเพื่อดูรูปแบบ)');
    const col = (name) => headers.indexOf(name);
    return table.slice(1).map((r) => {
      const get = (name) => (col(name) >= 0 ? String(r[col(name)] || '').trim() : '');
      return { code: get('code'), name: get('name'), category: get('category'), description: get('description'), folder_url: get('folder_url') };
    });
  }

      '<button type="button" class="btn btn-outline" data-action="csv-template">' + icon('download', 18) + 'ดาวน์โหลดไฟล์ตัวอย่าง</button>' +

      '<input id="csv-file" type="file" accept=".csv,text/csv" class="sr-only" tabindex="-1"></div>' + body + '</div>';
  }

  function downloadTemplate() {
    const blob = new Blob([CSV_TEMPLATE], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'csv-template.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function readFileText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(new Error('อ่านไฟล์ไม่ได้'));
      reader.readAsText(file, 'utf-8');
    });
  }

  async function loadCsvFile(file) {
    try {
      const text = await readFileText(file);
      if (text.indexOf('�') >= 0) throw new Error('กรุณาบันทึกไฟล์เป็น CSV UTF-8 (ใน Excel: บันทึกเป็น → CSV UTF-8)');
      const table = parseCsv(text);
      if (table.length < 2) throw new Error('ไม่พบข้อมูลในไฟล์');
      const rows = csvRowsToObjects(table);
      state.csv = { fileName: file.name, rows, loading: true };
      render();
      const verdicts = await call('previewCsv', rows);
      state.csv = { fileName: file.name, rows, verdicts };
    } catch (err) {
      state.csv = null;
      if (err.code !== 'auth') toast(err.message, 'error');
    }
    if (state.view === 'csv') render();
  }

  async function importCsv(btn) {
    const c = state.csv;
    const rows = c.rows.filter((r, i) => c.verdicts[i].status === 'new');
    // Rows rejected by the preview are reported with their reasons alongside the server's results.
    const result = {
      created: [],
      skipped: c.rows.filter((r, i) => c.verdicts[i].status !== 'new').map((r) => ({ code: r.code, message: c.verdicts[c.rows.indexOf(r)].message })),
      warnings: [],
    };
    await busy(btn, async () => {
      for (let i = 0; i < rows.length; i += CSV_CHUNK) {
        const el = $('#csv-progress');
        if (el) el.innerHTML = progressHtml('กำลังนำเข้า ' + Math.min(i + CSV_CHUNK, rows.length) + ' จาก ' + rows.length + ' รายการ', Math.round((i / rows.length) * 100));
        const data = await call('importCsv', rows.slice(i, i + CSV_CHUNK));
        result.created = result.created.concat(data.created);
        result.skipped = result.skipped.concat(data.skipped);
        result.warnings = result.warnings.concat(data.warnings);
      }
      state.csv = Object.assign({}, c, { result });
      await loadAll();
      toast('นำเข้า ' + result.created.length + ' รายการแล้ว');
    });
    if (state.csv && !state.csv.result && result.created.length) {
      // Partial import before an error: show what went in and refresh the list.
      state.csv = Object.assign({}, c, { result });
      await loadAll().catch(() => {});
    }
    if (state.view === 'csv') render();
  }

      shopName: $('#set-name').value.trim(),
      lineOaId: $('#set-line').value.trim(),
      primaryColor: $('#set-color-hex').value.trim(),
      workerUrl: $('#set-worker').value.trim(),
    };
    if (!values.shopName) return invalid('set-name', 'กรุณากรอกชื่อร้าน');
    if (!/^#[0-9a-f]{6}$/i.test(values.primaryColor)) return invalid('set-color-hex', 'สีหลักต้องเป็นรหัสสี เช่น #1F5FAE');
    if (values.workerUrl && !/^https:\/\//i.test(values.workerUrl)) return invalid('set-worker', 'Worker URL ต้องขึ้นต้นด้วย https://');
    const btn = form.querySelector('[type=submit]');
    const save = async (password) => {
      const data = await call('saveSettings', values, password);
      state.settings = data.settings;
      applyTheme(state.settings.primaryColor);
      renderChrome();
      setWorkerEditing(false); // the saved URL is now the baseline
      report(data, 'บันทึกการตั้งค่าร้านแล้ว');
    };
    if (normUrl(values.workerUrl) === normUrl(state.settings.workerUrl)) {
      await busy(btn, () => save());
      return;
    }

    // Worker URL changed: warn, then ask for the user's password (checked again on the server).
    const warning = 'เปลี่ยนจาก\n' + (state.settings.workerUrl || '(ยังไม่ได้ตั้ง)') + '\nเป็น\n' + (values.workerUrl || '(ว่าง)') + '\n\n' +
      '⚠ ระบบจะส่งข้อมูลสินค้าพร้อมรหัสลับของระบบ (API_SECRET) ไปยังที่อยู่ใหม่นี้ และลิงก์ที่คัดลอกต่อจากนี้จะใช้ที่อยู่ใหม่ ' +
      'ถ้าใส่ผิดหรือไม่ใช่ Worker ของร้านนี้ ข้อมูลอาจรั่วไหลหรือหน้าร้านจะไม่อัปเดต';
    let note = '';
    for (;;) {
      const answer = await modal({
        title: 'ยืนยันการเปลี่ยน Worker URL',
        body: note + warning,
        confirmText: 'ยืนยันและบันทึก',
        danger: true,
        fields: [{ id: 'password', label: 'ใส่รหัสผ่านของคุณเพื่อยืนยัน', type: 'password' }],
      });
      if (!answer) return;
      if (!answer.password) {
        note = 'กรุณาใส่รหัสผ่าน\n\n';
        continue;
      }
      let retry = false;
      await busy(btn, async () => {
        try {
          await save(answer.password);
        } catch (err) {
          if (err.code !== 'bad_password') throw err;
          retry = true;
        }
      });
      if (!retry) return;
      note = 'รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่\n\n';
    }
  }

  /** Worker URL is read-only (grey) until "แก้ไข" is pressed; "ยกเลิก" restores the saved value. */
  function setWorkerEditing(on) {
    const input = $('#set-worker');
    const btn = $('#worker-edit-btn');
    const warn = $('#worker-warn');
    if (!input || !btn) return;
    input.readOnly = !on;
    btn.textContent = on ? 'ยกเลิก' : 'แก้ไข';
    if (on) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    } else {
      input.value = state.settings.workerUrl || '';
      if (warn) warn.hidden = true;
    }
  }

  /** Same normalisation as the server: trimmed, no trailing slashes. */
  function normUrl(u) {
    return String(u || '').trim().replace(/\/+$/, '');
  }

  async function uploadLogo(file) {
    const btn = document.querySelector('[data-input="logo-file"]');
    await busy(btn, async () => {
      const isPng = file.type === 'image/png';
      const img = await resizeImage(file, 512, isPng ? 'image/png' : 'image/jpeg', 0.9);
      const data = await call('uploadLogo', img);
      state.settings.logoFileId = data.logoFileId;
      renderChrome();
      const row = $('#logo-row');
      if (row) row.querySelector('.logo').outerHTML = logoHtml();
      report(data, 'เปลี่ยนโลโก้แล้ว');
    });
  }

  function categoriesHtml() {
    return '<div class="card"><form id="cat-form" class="field" novalidate><label for="cat-new">เพิ่มหมวดหมู่ใหม่</label>' +
      '<div class="input-row"><input id="cat-new" class="input" maxlength="50" placeholder="เช่น บำรุงผม">' +
      '<button type="submit" class="btn btn-primary btn-lg"><span>' + icon('plus', 18) + 'เพิ่ม</span></button></div></form></div>' +
      '<div class="card" style="margin-top:12px"><h2>หมวดหมู่ทั้งหมด (' + state.categories.length + ')</h2>' +
      (state.categories.length
        ? '<div class="list-rows">' + state.categories.map((c) =>
            '<div class="list-row"><div class="grow"><span class="title">' + esc(c.name) + '</span><span class="muted">' + c.count + ' สินค้า</span></div>' +
            '<button type="button" class="icon-btn" data-action="rename-category" data-name="' + esc(c.name) + '" aria-label="เปลี่ยนชื่อหมวด ' + esc(c.name) + '">' + icon('edit', 20) + '</button>' +
            '<button type="button" class="icon-btn danger" data-action="delete-category" data-name="' + esc(c.name) + '"' +
            (c.count ? ' disabled aria-label="ลบหมวด ' + esc(c.name) + ' ไม่ได้ เพราะยังมีสินค้า"' : ' aria-label="ลบหมวด ' + esc(c.name) + '"') + '>' + icon('trash', 20) + '</button></div>'
          ).join('') + '</div>'
        : '<p class="muted">ยังไม่มีหมวดหมู่</p>') +
      '<p class="hint">เปลี่ยนชื่อหมวดแล้วสินค้าในหมวดจะเปลี่ยนตามทั้งหมด · ลบได้เฉพาะหมวดที่ไม่มีสินค้า</p></div>';
  }

  async function addCategory(form) {
    const name = $('#cat-new').value.trim();
    if (!name) return invalid('cat-new', 'กรุณากรอกชื่อหมวดหมู่');
    await busy(form.querySelector('[type=submit]'), async () => {
      await call('addCategory', name);
      await refreshCategories();
      toast('เพิ่มหมวด ' + name + ' แล้ว');
      render();
    });
  }

  async function renameCategory(btn) {
    const oldName = btn.getAttribute('data-name');
    const values = await modal({ title: 'เปลี่ยนชื่อหมวดหมู่', fields: [{ id: 'name', label: 'ชื่อใหม่', value: oldName }], confirmText: 'บันทึก' });
    if (!values || !values.name.trim() || values.name.trim() === oldName) return;
    await busy(btn, async () => {
      const data = await call('renameCategory', oldName, values.name.trim());
      state.products.forEach((p) => { if (p.category === oldName) p.category = data.name; });
      await refreshCategories();
      if (state.categoryFilter === oldName) state.categoryFilter = data.name;
      toast('เปลี่ยนชื่อหมวดแล้ว (' + data.count + ' สินค้า)');
      if (data.sync && !data.sync.synced && data.count) toast('อัปเดตหน้าร้านไม่สำเร็จ ' + data.sync.failed + ' สินค้า', 'warn');
      render();
    });
  }

  async function deleteCategory(btn) {
    const name = btn.getAttribute('data-name');
    if (!(await confirmDialog('ลบหมวด ' + name + '?', 'ลบแล้วกู้คืนไม่ได้ แต่เพิ่มใหม่ได้ภายหลัง', 'ลบหมวด', true))) return;
    await busy(btn, async () => {
      await call('deleteCategory', name);
      await refreshCategories();
      toast('ลบหมวด ' + name + ' แล้ว');
      render();
    });
  }

  function usersHtml() {
    const me = state.user;
    const role = (r) => '<span class="role ' + r + '">' + (r === 'admin' ? 'Admin' : 'Staff') + '</span>';
    const fmt = (iso) => (iso ? new Date(iso).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' }) : 'ยังไม่เคยเข้าใช้');
    let top;
    if (isAdmin()) {
      top = '<div class="card"><div class="section-head"><h2>ผู้ใช้งาน' + (state.users ? ' (' + state.users.length + ')' : '') + '</h2>' +
        '<button type="button" class="btn btn-outline" data-action="create-user">' + icon('plus', 18) + 'เพิ่มผู้ใช้</button></div>' +
        (state.users
          ? '<div class="list-rows">' + state.users.map((u) => {
              const self = u.username === me.username;
              return '<div class="list-row"><span class="avatar">' + icon('user', 20) + '</span><div class="grow">' +
                '<span class="title">' + esc(u.displayName) + ' ' + role(u.role) + (self ? ' <span class="muted">(คุณ)</span>' : '') + '</span>' +
                '<span class="muted">@' + esc(u.username) + ' · ' + fmt(u.lastLoginAt) + '</span></div>' +
                (self ? '' :
                  '<button type="button" class="icon-btn" data-action="reset-password" data-user="' + esc(u.username) + '" aria-label="ตั้งรหัสผ่านใหม่ให้ ' + esc(u.displayName) + '">' + icon('key', 20) + '</button>' +
                  '<button type="button" class="icon-btn danger" data-action="delete-user" data-user="' + esc(u.username) + '" aria-label="ลบผู้ใช้ ' + esc(u.displayName) + '">' + icon('trash', 20) + '</button>') +
                '</div>';
            }).join('') + '</div>'
          : '<div class="loading-block" aria-label="กำลังโหลดผู้ใช้"></div>') +
        '<p class="hint">เพิ่มผู้ใช้ ตั้งรหัสผ่านใหม่ และลบผู้ใช้ ทำได้เฉพาะ Admin · ทุกการแก้ไขบันทึกชื่อผู้ใช้ลงแท็บ AuditLog</p></div>';
    } else {
      top = '<div class="card"><div class="list-row"><span class="avatar">' + icon('user', 22) + '</span><div class="grow">' +
        '<span class="title">' + esc(me.displayName) + ' ' + role(me.role) + '</span><span class="muted">@' + esc(me.username) + '</span></div></div>' +
        '<p class="hint">การเพิ่ม ลบ และตั้งรหัสผ่านใหม่ให้ผู้ใช้อื่น ทำได้เฉพาะ Admin</p></div>';
    }
    return top + '<form id="pw-form" class="card" style="margin-top:12px" novalidate><h2>เปลี่ยนรหัสผ่านของฉัน</h2>' +
      '<div class="field"><label for="pw-old">รหัสผ่านปัจจุบัน</label><input id="pw-old" class="input" type="password" autocomplete="current-password"></div>' +
      '<div class="field"><label for="pw-new">รหัสผ่านใหม่</label><input id="pw-new" class="input" type="password" autocomplete="new-password"><p class="hint">อย่างน้อย 8 ตัวอักษร</p></div>' +
      '<div class="field"><label for="pw-confirm">ยืนยันรหัสผ่านใหม่</label><input id="pw-confirm" class="input" type="password" autocomplete="new-password"></div>' +
      '<button type="submit" class="btn btn-outline btn-lg"><span>' + icon('key', 18) + 'เปลี่ยนรหัสผ่าน</span></button></form>';
  }

  async function loadUsers() {
    try {
      state.users = await call('listUsers');
    } catch (err) {
      state.users = [];
      if (err.code !== 'auth') toast(err.message, 'error');
    }
    if (state.view === 'settings' && state.settingsTab === 'users') render();
  }

  async function createUser(btn) {
    const values = await modal({
      title: 'เพิ่มผู้ใช้',
      confirmText: 'เพิ่มผู้ใช้',
      fields: [
        { id: 'username', label: 'ชื่อผู้ใช้ (ใช้ตอนเข้าสู่ระบบ)', hint: 'a-z 0-9 . _ - ยาว 3–30 ตัว' },
        { id: 'displayName', label: 'ชื่อที่แสดง' },
        { id: 'role', label: 'สิทธิ์', type: 'select', value: 'staff', options: [['staff', 'Staff — จัดการสินค้าและตั้งค่าร้าน'], ['admin', 'Admin — ทำได้ทุกอย่าง รวมถึงจัดการผู้ใช้']] },
        { id: 'password', label: 'รหัสผ่านเริ่มต้น', type: 'password', hint: 'อย่างน้อย 8 ตัวอักษร แจ้งผู้ใช้ให้เปลี่ยนเองภายหลัง' },
      ],
    });
    if (!values) return;
    await busy(btn, async () => {
      const user = await call('createUser', values);
      state.users = (state.users || []).concat([user]);
      toast('เพิ่มผู้ใช้ ' + user.username + ' แล้ว');
      render();
    });
  }

  async function resetPassword(btn) {
    const username = btn.getAttribute('data-user');
    const values = await modal({
      title: 'ตั้งรหัสผ่านใหม่ให้ @' + username,
      body: 'ผู้ใช้นี้จะถูกออกจากระบบทุกเครื่อง',
      confirmText: 'ตั้งรหัสผ่าน',
      fields: [{ id: 'password', label: 'รหัสผ่านใหม่', type: 'password', hint: 'อย่างน้อย 8 ตัวอักษร' }],
    });
    if (!values) return;
    await busy(btn, async () => {
      await call('resetPassword', username, values.password);
      toast('ตั้งรหัสผ่านใหม่ให้ @' + username + ' แล้ว');
    });
  }

  async function deleteUser(btn) {
    const username = btn.getAttribute('data-user');
    if (!(await confirmDialog('ลบผู้ใช้ @' + username + '?', 'ผู้ใช้นี้จะเข้าระบบไม่ได้อีก ประวัติใน AuditLog ยังอยู่', 'ลบผู้ใช้', true))) return;
    await busy(btn, async () => {
      await call('deleteUser', username);
      state.users = (state.users || []).filter((u) => u.username !== username);
      toast('ลบผู้ใช้ @' + username + ' แล้ว');
      render();
    });
  }

  async function changePassword(form) {
    const oldPw = $('#pw-old').value;
    const newPw = $('#pw-new').value;
    if (!oldPw) return invalid('pw-old', 'กรุณากรอกรหัสผ่านปัจจุบัน');
    if (newPw.length < 8) return invalid('pw-new', 'รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร');
    if (newPw !== $('#pw-confirm').value) return invalid('pw-confirm', 'ยืนยันรหัสผ่านไม่ตรงกัน');
    await busy(form.querySelector('[type=submit]'), async () => {
      const data = await call('changeMyPassword', oldPw, newPw);
      state.token = data.token;
      storage((s) => s.setItem('catalog.token', data.token));
      form.reset();
      toast('เปลี่ยนรหัสผ่านแล้ว');
    });
  }

  // ---------- events ----------
  function onClick(e) {
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      closePanel();
      if (nav.getAttribute('data-nav') === 'list' && state.view !== 'list') {
        state.categoryFilter = '';
        state.page = 1;
      }
      return setView(nav.getAttribute('data-nav'));
    }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const id = el.getAttribute('data-id');
    switch (el.getAttribute('data-action')) {
      case 'logout': return logout();
      case 'toggle-status': return toggleStatus(id);
      case 'copy': return copyLink(id);
      case 'edit': return openEdit(id);
      case 'add-product': return openAdd();
      case 'close-panel': return closePanel();
      case 'worker-edit':
        return setWorkerEditing($('#set-worker').readOnly);
      case 'copy-sheet':
        return copyText(state.settings.sheetUrl || '').then((ok) => toast(ok ? 'คัดลอกลิงก์ Google Sheet แล้ว' : 'คัดลอกไม่สำเร็จ กรุณาลองใหม่', ok ? 'success' : 'error'));
      case 'copy-drive':
        return copyText(state.settings.driveUrl || '').then((ok) => toast(ok ? 'คัดลอกลิงก์โฟลเดอร์ Google Drive แล้ว' : 'คัดลอกไม่สำเร็จ กรุณาลองใหม่', ok ? 'success' : 'error'));
      case 'page':
        state.page = Number(el.getAttribute('data-page')) || 1;
        renderListItems();
        window.scrollTo(0, 0);
        return undefined;
      case 'filter-category':
        state.categoryFilter = el.getAttribute('data-name');
        state.q = '';
        state.page = 1;
        return setView('list');
      case 'pick-files': {
        const input = document.getElementById(el.getAttribute('data-input'));
        if (input) input.click();
        return undefined;
      }
      case 'remove-image': return removeImage(el);
      case 'delete-product': return deleteProduct(el);
      case 'set-cover': return setCover(el, el.getAttribute('data-file'));
      case 'auto-cover': return setCover(el, '');
      case 'link-folder': return linkFolder(el);
      case 'csv-template': return downloadTemplate();
      case 'csv-import': return importCsv(el);
      case 'csv-reset':
        state.csv = null;
        return render();
      case 'settings-tab':
        if (state.settingsTab === 'shop') applyTheme(state.settings.primaryColor);
        state.settingsTab = el.getAttribute('data-tab');
        return render();
      case 'rename-category': return renameCategory(el);
      case 'delete-category': return deleteCategory(el);
      case 'create-user': return createUser(el);
      case 'reset-password': return resetPassword(el);
      case 'delete-user': return deleteUser(el);
      default: return undefined;
    }
  }

  function onSubmit(e) {
    const form = e.target;
    const handlers = { 'add-form': submitAdd, 'edit-form': submitEdit, 'shop-form': submitShop, 'cat-form': addCategory, 'pw-form': changePassword };
    if (handlers[form.id]) {
      e.preventDefault();
      handlers[form.id](form);
    }
  }

  function onChange(e) {
    const t = e.target;
    if (t.id === 'cat-filter') {
      state.categoryFilter = t.value;
      state.page = 1;
      renderListItems();
      return;
    }
    if (t.matches('[data-category-select]')) {
      const extra = document.getElementById(t.id + '-new');
      extra.hidden = t.value !== NEW_CATEGORY;
      if (!extra.hidden) extra.focus();
      return;
    }
    if (!t.files || !t.files.length) return;
    const files = Array.from(t.files);
    t.value = '';
    if (t.id === 'add-files') {
      state.addFiles = state.addFiles.concat(files);
      $('#add-file-list').innerHTML = addFileListHtml();
    } else if (t.id === 'edit-files' && panel) {
      const id = panel.id;
      uploadFiles(id, files, 'edit-progress').then(() => refreshProductViews()).catch((err) => { if (err.code !== 'auth') toast(err.message, 'error'); });
    } else if (t.id === 'csv-file') {
      loadCsvFile(files[0]);
    } else if (t.id === 'logo-file') {
      uploadLogo(files[0]);
    }
  }

  function onInput(e) {
    const t = e.target;
    if (t.id === 'q') {
      state.q = t.value;
      state.page = 1;
      renderListItems();
    } else if (t.id === 'set-worker') {
      const warn = $('#worker-warn');
      if (warn) warn.hidden = normUrl(t.value) === normUrl(state.settings.workerUrl);
    } else if (t.id === 'set-color') {
      $('#set-color-hex').value = t.value.toUpperCase();
      applyTheme(t.value);
    } else if (t.id === 'set-color-hex' && /^#[0-9a-f]{6}$/i.test(t.value.trim())) {
      $('#set-color').value = t.value.trim();
      applyTheme(t.value.trim());
    }
  }

  function onKeydown(e) {
    if (e.key === 'Escape' && panel && !$('#modal-root').children.length) closePanel();
  }

  // Broken Drive thumbnails (not shared yet, deleted) fall back to the placeholder icon behind them.
  document.addEventListener('error', (e) => {
    if (e.target && e.target.matches && e.target.matches('img[data-fallback]')) e.target.remove();
  }, true);

  function init() {
    applyTheme(state.settings.primaryColor);
    document.addEventListener('click', onClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKeydown);

    const saved = storage((s) => s.getItem('catalog.token'));
    if (!saved) return renderLogin();
    api('me', saved).then((user) => startSession(saved, user)).catch(() => renderLogin());
    return undefined;
  }

  init();
})();
</script>
