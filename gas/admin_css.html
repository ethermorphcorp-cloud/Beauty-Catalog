<style>
/* Admin UI — mobile-first (360px), breakpoints 640px and 1024px. Matches the approved mockup. */
:root {
  --primary: #2563EB;
  --on-primary: #FFFFFF;
  --accent-text: #2563EB;
  --primary-tint: #2563EB1F;
  --bg: #F6F6F7;
  --surface: #FFFFFF;
  --surface-2: #F4F4F6;
  --border: #E7E7EA;
  --border-strong: #D9D9DE;
  --text: #18181B;
  --text-2: #3F3F46;
  --muted: #63636B;
  --success-bg: #DCF5E3;
  --success: #166534;
  --warn-bg: #FDEFD3;
  --warn: #8A4B08;
  --danger-bg: #FCE4E4;
  --danger: #B91C1C;
  --radius: 14px;
  --radius-sm: 10px;
  --header-h: 64px;
  --nav-h: 80px;
  --font: 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.panel-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
svg { flex-shrink: 0; }

/* ---------- buttons ---------- */
.btn {
  min-height: 44px; padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none;
  position: relative; white-space: nowrap;
}
.btn:disabled { opacity: 0.55; cursor: default; }
.btn-primary { background: var(--primary); color: var(--on-primary); font-weight: 600; }
.btn-outline { background: var(--surface); color: #27272A; border-color: var(--border-strong); }
.btn-ghost { color: var(--text-2); }
.btn-danger { background: var(--danger); color: #FFFFFF; font-weight: 600; }
.btn-block { width: 100%; min-height: 48px; font-size: 15px; }
.btn-lg { min-height: 48px; font-size: 15px; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
}
.icon-btn:hover, .btn-outline:hover, .btn-ghost:hover { background: var(--surface-2); }
.icon-btn.danger { color: var(--danger); }
.icon-btn:disabled { color: #C4C4CA; cursor: default; background: transparent; }

.is-loading { color: transparent !important; pointer-events: none; }
.is-loading > * { visibility: hidden; }
.is-loading::after {
  content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid currentColor; border-color: var(--muted) transparent var(--muted) transparent;
  animation: spin 0.8s linear infinite;
}
.btn-primary.is-loading::after, .btn-danger.is-loading::after { border-color: var(--on-primary) transparent var(--on-primary) transparent; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- form controls ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-size: 14px; font-weight: 500; }
.input, .select, .textarea {
  width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); background: var(--surface); font-size: 15px; color: var(--text);
}
.textarea { padding: 12px 14px; line-height: 1.6; resize: vertical; min-height: 140px; }
.select { appearance: none; padding-right: 40px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--danger); }
.input[readonly] { background: var(--surface-2); color: #52525B; }
.input-row { display: flex; gap: 8px; }
.input-row .input { flex: 1; min-width: 0; }
.hint { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
.hint.center { text-align: center; }
.form-error { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--danger); }
.muted { color: var(--muted); font-size: 13px; }

.switch {
  width: 52px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer;
  display: inline-flex; align-items: center; flex-shrink: 0;
}
.switch::before {
  content: ''; width: 52px; height: 32px; border-radius: 999px; background: #D4D4D8; transition: background 0.15s;
}
.switch .switch-knob {
  position: absolute; left: 0; top: 9px; width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transform: translateX(3px); transition: transform 0.15s;
}
.switch { position: relative; }
.switch[aria-checked="true"]::before { background: var(--primary); }
.switch[aria-checked="true"] .switch-knob { transform: translateX(23px); }
.switch:disabled { opacity: 0.6; cursor: progress; }
.switch-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.switch-label { font-size: 12px; font-weight: 500; color: var(--muted); min-width: 28px; text-align: right; }
.switch-label.on { color: var(--success); }

/* ---------- layout chrome ---------- */
.app-header {
  position: sticky; top: 0; z-index: 20; height: var(--header-h);
  padding: 0 4px 0 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand-text strong { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text span { font-size: 12px; color: var(--muted); }
.logo {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: #FFFFFF;
  object-fit: cover; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--on-primary);
}
.logo.initials { background: var(--primary); border-color: transparent; }
#brand-logo .logo { width: 45px; height: 45px; border-radius: 11px; }
#brand-logo .logo.initials { font-size: 18px; }
.header-user { display: flex; align-items: center; gap: 4px; }
.user-chip { display: none; font-size: 13px; color: var(--muted); }
.desk-tabs { display: none; }

.view { padding: 16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.page.narrow { max-width: 640px; }
.page-title { margin: 0; font-size: 18px; font-weight: 600; }
.section-title { margin: 8px 0 0; font-size: 15px; font-weight: 600; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 6px 4px calc(12px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
}
.bottom-nav button {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 13px; font-weight: 500;
}
.bottom-nav button[aria-current="page"] { color: var(--accent-text); font-weight: 700; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 14px;
}
.card h3, .card h2 { margin: 0; font-size: 15px; font-weight: 600; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.link { font-size: 13px; color: var(--text-2); display: inline-flex; align-items: center; gap: 4px; }
.divider { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #8A8A93; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.loading-block { padding: 48px 0; display: flex; justify-content: center; }
.loading-block::after { content: ''; width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--border-strong); border-top-color: var(--primary); animation: spin 0.8s linear infinite; }

/* ---------- login ---------- */
.login { min-height: 100vh; padding: 24px; display: flex; align-items: center; justify-content: center; }
.login-card {
  width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px 24px; display: flex; flex-direction: column; gap: 18px;
}
.login-brand { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.login-brand h1 { margin: 4px 0 0; font-size: 20px; font-weight: 600; }
.login-brand p { margin: 0; font-size: 14px; color: var(--muted); }
.login-brand .logo { width: 56px; height: 56px; border-radius: 14px; font-size: 20px; }

/* ---------- product list ---------- */
.list-toolbar { display: flex; flex-direction: column; gap: 8px; }
.search { position: relative; flex: 1; }
.search svg { position: absolute; left: 14px; top: 14px; color: var(--muted); pointer-events: none; }
.search .input { padding-left: 44px; }
.list-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); min-height: 32px; }
.chip-filter {
  display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 10px; border-radius: 999px;
  border: 0; background: var(--primary-tint); color: var(--accent-text); font-size: 13px; font-weight: 500; cursor: pointer;
}
.product-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.product-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px;
  display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; grid-template-areas: "thumb info switch" "actions actions actions";
  gap: 12px; align-items: start;
}
.pc-thumb {
  grid-area: thumb; width: 64px; height: 64px; border-radius: var(--radius-sm); background: var(--primary-tint);
  color: var(--accent-text); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
}
.pc-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--surface-2); }
.pc-info { grid-area: info; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pc-code { font-size: 12px; font-weight: 500; color: var(--muted); }
.pc-name { font-size: 15px; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere; }
.pc-cat { font-size: 12px; color: var(--muted); }
.pc-switch { grid-area: switch; }
.pc-actions { grid-area: actions; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.product-card.is-hidden .pc-thumb { opacity: 0.45; }
.product-card.is-hidden .pc-name { color: var(--muted); }

/* ---------- summary ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--border); background: var(--surface); }
.stat span { font-size: 13px; font-weight: 500; }
.stat strong { font-size: 28px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat.on { background: var(--success-bg); border-color: var(--success-bg); color: var(--success); }
.stat.off { background: #EDEDF0; border-color: #EDEDF0; color: var(--text-2); }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cat-tile {
  text-align: left; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; color: var(--text);
}
.cat-tile:hover { border-color: var(--border-strong); }
.cat-tile .name { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.cat-tile .count { font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cat-tile .count small { font-size: 13px; font-weight: 500; color: var(--muted); }
.bar { width: 100%; height: 6px; border-radius: 999px; background: #E2E2E6; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--primary); }
.cat-tile .split { font-size: 12px; color: #52525B; }

/* ---------- edit panel ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(24, 24, 27, 0.32); }
.panel {
  position: fixed; inset: 0; z-index: 41; background: var(--bg);
  display: flex; flex-direction: column;
}
.panel-header {
  height: var(--header-h); flex-shrink: 0; padding: 0 12px 0 4px; background: var(--surface);
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 4px;
}
.crumbs { display: flex; align-items: center; gap: 0; min-width: 0; flex: 1; font-size: 15px; }
.crumb-link {
  min-height: 44px; padding: 0 8px 0 12px; border: 0; background: transparent; cursor: pointer;
  color: var(--accent-text); font-weight: 500; white-space: nowrap;
}
.crumb-sep { color: var(--muted); padding: 0 2px; }
.crumb-current { padding-left: 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-footer.single { grid-template-columns: minmax(0, 1fr); }
.panel-header h2 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.panel-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel-footer {
  flex-shrink: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--surface);
  border-top: 1px solid var(--border); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px;
}
.locked {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); font-size: 13px; color: #52525B;
}
.locked strong { margin-left: auto; color: var(--text-2); font-variant-numeric: tabular-nums; }
.row-between { display: flex; align-items: center; gap: 12px; }
.row-between > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.img-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.img-tile { position: relative; margin: 0; aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; background: var(--primary-tint); }
.img-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-badge {
  position: absolute; left: 6px; top: 6px; font-size: 11px; font-weight: 600; padding: 1px 8px;
  border-radius: 999px; background: var(--primary); color: var(--on-primary);
}
.img-remove {
  position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: 0; background: transparent; padding: 6px;
  display: flex; align-items: flex-start; justify-content: flex-end; cursor: pointer;
}
.img-remove span {
  width: 26px; height: 26px; border-radius: 999px; background: rgba(24, 24, 27, 0.62); color: #FFFFFF;
  display: flex; align-items: center; justify-content: center;
}
.img-add {
  aspect-ratio: 1; border: 1.5px dashed #C9C9CF; border-radius: var(--radius-sm); background: var(--surface);
  color: var(--text-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 13px; font-weight: 500; cursor: pointer;
}
.progress { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-2); }
.progress-track { height: 6px; border-radius: 999px; background: #E2E2E6; overflow: hidden; }
.progress-track > span { display: block; height: 100%; background: var(--primary); transition: width 0.2s; }
.file-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-2); }

/* ---------- settings ---------- */
.segmented { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E9E9EC; }
.segmented button {
  min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #52525B;
  font-size: 13px; font-weight: 500; cursor: pointer;
}
.segmented button[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(24, 24, 27, 0.12); }
.logo-row { display: flex; align-items: center; gap: 12px; }
.logo-row .logo { width: 64px; height: 64px; border-radius: 14px; font-size: 22px; }
.color-row { display: flex; align-items: center; gap: 10px; }
.color-row input[type="color"] { width: 48px; height: 48px; padding: 0; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; }
.color-row .input { width: 140px; font-variant-numeric: tabular-nums; }
.preview-box { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.chip { align-self: flex-start; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: var(--primary-tint); color: var(--accent-text); }
.list-rows { display: flex; flex-direction: column; }
.list-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #F0F0F2; }
.list-row:last-child { border-bottom: 0; }
.list-row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.list-row .title { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; overflow-wrap: anywhere; }
.avatar {
  width: 40px; height: 40px; border-radius: 999px; background: var(--primary-tint); color: var(--accent-text);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.role { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--primary-tint); color: var(--accent-text); }
.role.staff { background: #F1F1F3; color: #52525B; font-weight: 500; }
.sticky-actions {
  position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 5;
  margin: 0 -16px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border);
}

/* ---------- CSV ---------- */
.csv-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.csv-head > div { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 4px; }
.csv-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.csv-stats .file { flex: 1; font-size: 14px; font-weight: 500; }
.csv-stat { border-radius: 12px; padding: 8px 16px; display: flex; align-items: baseline; gap: 8px; }
.csv-stat strong { font-size: 22px; font-weight: 700; }
.csv-stat span { font-size: 13px; font-weight: 500; }
.s-new { background: var(--success-bg); color: var(--success); }
.s-duplicate { background: var(--warn-bg); color: var(--warn); }
.s-invalid { background: var(--danger-bg); color: #991B1B; }
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; max-height: 60vh; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
.table th { position: sticky; top: 0; background: #FAFAFB; color: #52525B; font-size: 13px; font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.table td { padding: 10px 12px; border-bottom: 1px solid #F0F0F2; vertical-align: top; }
.table td.wrap { max-width: 280px; overflow-wrap: anywhere; }
.pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.csv-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px; }

/* ---------- toasts & modal ---------- */
.toasts {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); z-index: 60;
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.toast {
  max-width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px;
  background: #27272A; color: #FFFFFF; font-size: 14px; box-shadow: 0 6px 20px rgba(24, 24, 27, 0.18);
  animation: toast-in 0.2s ease-out; pointer-events: auto;
}
.toast-warn svg { color: #FBBF24; }
.toast-error { background: #7F1D1D; }
.toast.leaving { opacity: 0; transition: opacity 0.25s; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }
.modal {
  position: fixed; z-index: 51; left: 16px; right: 16px; top: 50%; transform: translateY(-50%);
  max-width: 420px; margin: 0 auto; background: var(--surface); border-radius: 16px; padding: 20px;
  display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 48px rgba(24, 24, 27, 0.2);
  max-height: calc(100vh - 32px); overflow-y: auto;
}
#modal-root .scrim { z-index: 50; }
.modal h2 { margin: 0; font-size: 17px; font-weight: 600; }
.modal p { margin: 0; font-size: 14px; color: var(--text-2); line-height: 1.6; white-space: pre-line; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- phones: CSV preview rows become cards ---------- */

  .table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
